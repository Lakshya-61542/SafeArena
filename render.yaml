services:
  - type: web
    name: safearena-public-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT 'backend.main:build_app()'
    healthCheckPath: /api/health
    envVars:
      - key: SAFEARENA_PUBLIC_DEMO
        value: "1"
      - key: SAFEARENA_DATA_DIR
        value: /tmp/safearena-data
      - key: SAFEARENA_MODE
        value: local
      - key: LLM_PROVIDER
        value: mock
      - key: BIND_HOST
        value: 0.0.0.0
