name: SafeArena tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate public Docker Compose overlay
        env:
          SAFEARENA_DOMAIN: safearena.example.com
          SAFEARENA_ALLOWED_HOSTS: safearena.example.com
        run: docker compose -f docker-compose.yml -f docker-compose.public.yml config --quiet
